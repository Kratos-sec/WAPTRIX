# Name-based gateway for the benchmark lab: one hostname per application, all on port 80.
# Upstream Server headers are passed through so banner checks see the application, not the gateway.

server_tokens off;
proxy_http_version 1.1;
proxy_pass_header Server;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
client_max_body_size 20m;

server {
    listen 80;
    server_name dvwa.waptrix.lab;
    location / { proxy_pass http://dvwa:80; }
}

server {
    listen 80;
    server_name juiceshop.waptrix.lab;
    location / { proxy_pass http://juiceshop:3000; }
}

server {
    listen 80;
    server_name webgoat.waptrix.lab;
    # WebGoat lives under /WebGoat; send the root there so every engine starts from the application.
    location = / { return 302 /WebGoat/; }
    location / { proxy_pass http://webgoat:8080; }
}

server {
    listen 80;
    server_name bwapp.waptrix.lab;
    location / { proxy_pass http://bwapp:80; }
}

server {
    listen 80;
    server_name mutillidae.waptrix.lab;
    location / { proxy_pass http://mutillidae:80; }
}

server {
    listen 80 default_server;
    return 444;
}
