[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waptrix"
version = "1.0.0"
description = "Strictly passive web application security auditing and OWASP Top 10 (2025) compliance platform"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "certifi>=2024.2.2",
    "beautifulsoup4>=4.12",
    "cryptography>=42.0",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
pdf = ["weasyprint>=61.0"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
waptrix = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*", "sample_data*"]

[tool.setuptools.package-data]
"app.compliance" = ["*.json"]
"app.reporting" = ["templates/*.html"]
"sample_data" = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
