# Isolated benchmark lab (paper Section III-E, Table VI). Layered on top of the main stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.lab.yml up -d --build
#   ./lab/bootstrap.sh                       # one-time database setup inside DVWA, bWAPP, Mutillidae
#   docker compose -f docker-compose.yml -f docker-compose.lab.yml exec api \
#       python -m app.cli lab collect --reps 3 --out /lab/runs/latest
#   docker compose -f docker-compose.yml -f docker-compose.lab.yml exec api \
#       python -m app.cli lab evaluate --runs /lab/runs/latest --out /lab/results/latest
#
# The lab network is `internal`: the vulnerable apps have no route to the internet and publish no ports.
# Only the api and zap containers join it. Every app sits behind one nginx gateway on port 80, so each
# app gets a stable hostname under waptrix.lab and the scanners see standard ports.
# The older PHP images only ship for amd64; Docker Desktop on Apple silicon runs them under emulation.

services:
  api:
    networks: [default, lab]
    volumes:
      - ./lab:/lab

  zap:
    networks: [default, lab]

  lab-gateway:
    image: nginx:1.30.7-alpine
    volumes:
      - ./lab/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [dvwa, juiceshop, webgoat, bwapp, mutillidae]
    networks:
      lab:
        aliases:
          - dvwa.waptrix.lab
          - juiceshop.waptrix.lab
          - webgoat.waptrix.lab
          - bwapp.waptrix.lab
          - mutillidae.waptrix.lab
    restart: unless-stopped

  dvwa:
    image: vulnerables/web-dvwa:latest
    platform: linux/amd64
    networks: [lab]
    restart: unless-stopped

  juiceshop:
    image: bkimminich/juice-shop:v17.1.1
    networks: [lab]
    restart: unless-stopped

  webgoat:
    image: webgoat/webgoat:v2023.8
    environment:
      TZ: UTC
    networks: [lab]
    restart: unless-stopped

  bwapp:
    image: raesene/bwapp:latest
    platform: linux/amd64
    networks: [lab]
    restart: unless-stopped

  mutillidae:
    image: webpwnized/mutillidae:www
    depends_on: [mutillidae-db]
    networks: [lab]
    restart: unless-stopped

  mutillidae-db:
    image: webpwnized/mutillidae:database
    networks:
      lab:
        aliases: [database]  # host name the Mutillidae web image expects
    restart: unless-stopped

networks:
  lab:
    internal: true  # no egress: benchmark targets cannot reach, or be reached from, outside the stack
