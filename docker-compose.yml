# WAPTrix stack. Works the same on Linux, macOS and Windows (Docker Desktop / WSL2).
#   cp .env.example .env   # then set ZAP_API_KEY
#   docker compose up --build
#   open http://localhost:8080          (dashboard; the API is proxied at /api)
# Only the dashboard port is published, on 127.0.0.1. API and ZAP are reachable only inside the stack.

services:
  api:
    build: ./backend
    environment:
      WAPTRIX_DB: /data/waptrix.db
      WAPTRIX_ZAP_URL: http://zap:8090
      WAPTRIX_ZAP_API_KEY: ${ZAP_API_KEY:?set ZAP_API_KEY in .env (see .env.example)}
      WAPTRIX_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      WAPTRIX_LOG_LEVEL: ${WAPTRIX_LOG_LEVEL:-INFO}
    volumes:
      - waptrix-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets Linux reach apps on the host, as Docker Desktop does
    depends_on:
      zap:
        condition: service_started
    restart: unless-stopped

  zap:
    image: zaproxy/zap-stable:2.17.0
    command: >
      zap.sh -Xmx1g -daemon -host 0.0.0.0 -port 8090
      -config api.key=${ZAP_API_KEY:?set ZAP_API_KEY in .env (see .env.example)}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    healthcheck:
      test: ["CMD-SHELL", "curl -fs \"http://127.0.0.1:8090/JSON/core/view/version/?apikey=$$ZAP_KEY\" >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 60s
    environment:
      ZAP_KEY: ${ZAP_API_KEY}
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  waptrix-data:
